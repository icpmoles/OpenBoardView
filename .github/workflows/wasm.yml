name: Build WebAssembly
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # the build number is the commit count
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake make python3
      - name: WebAssembly build
        run: ./build_web.sh --recompile
      - uses: actions/upload-artifact@v7
        with:
          name: "openboardview_web_wasm.${{ github.sha }}"
          path: build_web/dist
          if-no-files-found: error
      - name: Package site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: build_web/dist

  deploy-pages:
    needs: build-wasm
    # Only the default branch gets published, never pull requests
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write # lets GitHub Pages verify where the deployment comes from
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, without interrupting the one in progress
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

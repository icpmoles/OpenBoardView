<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>OpenBoardView</title>
<link rel="icon" href="icon.svg">
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 14px sans-serif; }
	/* SDL follows the CSS size of the canvas */
	#canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
	[hidden] { display: none !important; }
	.notice { position: fixed; padding: 8px 12px; border-radius: 4px; background: #222; color: #fff; }
	#banner { left: 8px; bottom: 44px; max-width: calc(100% - 40px); background: #743; }
	#status, #chooser { left: 50%; top: 50%; transform: translate(-50%, -50%); }
	button { margin-left: 8px; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status" class="notice" role="status">Loading OpenBoardView…</div>
<div id="banner" class="notice" role="alert" hidden><span></span><button onclick="this.parentNode.hidden = true">Dismiss</button></div>
<div id="chooser" class="notice" hidden>Select a file
	<button id="chooser-open">Browse…</button><button onclick="this.parentNode.hidden = true">Cancel</button>
</div>
<input id="board-input" type="file" multiple hidden>
<input id="attachment-input" type="file" hidden>
<script>
	function fatal(message) {
		var status = document.getElementById('status');
		status.textContent = message + ' ';
		var button = document.createElement('button');
		button.textContent = 'Reload';
		button.onclick = function () { location.reload(); };
		status.appendChild(button);
		status.hidden = false;
	}

	var Module = {
		canvas: document.getElementById('canvas'),
		obvFatal: fatal,
		onRuntimeInitialized: function () { document.getElementById('status').hidden = true; },
		onAbort: function (reason) { fatal('OpenBoardView stopped: ' + reason); }
	};

	// An uncaught C++ exception or a trap ends the main loop and would leave a frozen picture
	window.addEventListener('error', function (event) {
		var error = event.error;
		if (error && (error instanceof WebAssembly.RuntimeError || (WebAssembly.Exception && error instanceof WebAssembly.Exception)))
			fatal('OpenBoardView crashed, the file may be damaged or unsupported.');
	});

	if (location.protocol === 'file:') {
		fatal('Browsers cannot load WebAssembly from file://, please serve this directory over HTTP.');
	} else if (!document.createElement('canvas').getContext('webgl2')) {
		fatal('OpenBoardView needs WebGL 2, which is not available in this browser.');
	} else {
		var script = document.createElement('script');
		script.src = 'openboardview.js';
		script.onerror = function () { fatal('Could not download OpenBoardView.'); };
		document.body.appendChild(script);
	}
</script>
</body>
</html>
